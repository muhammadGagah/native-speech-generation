version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Ruff is pinned in pyproject.toml and .pre-commit-config.yaml; upgrade both together on purpose.
      - dependency-name: "ruff"
    groups:
      python-build:
        update-types:
          - minor
          - patch

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
