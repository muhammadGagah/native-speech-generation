name: build addon

on:
  push:
    tags: ["*"]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gettext
          uv sync

      - name: Code checks
        run: export SKIP=no-commit-to-branch; uv run pre-commit run --all-files

      - name: Build add-on
        run: uv run scons && uv run scons pot

      - uses: actions/upload-artifact@v7
        with:
          name: packaged_addon
          path: ./*.nvda-addon
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: pot
          path: ./*.pot
          if-no-files-found: error

  python311_compatibility:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check Python 3.11 syntax compatibility
        run: python -m compileall addon buildVars.py sconstruct site_scons tests

  upload_release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: ["build"]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          path: .
          merge-multiple: true

      - name: Display release files
        run: ls -R

      - name: Calculate sha256
        run: |
          echo -e "\nSHA256: " >> changelog.md
          sha256sum *.nvda-addon >> changelog.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.nvda-addon
            *.pot
          body_path: changelog.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref, '-') }}
